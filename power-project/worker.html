<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="worker-pro" class="dashboard-body">
  <nav class="top-nav">
    <h1>Worker Operations Deck</h1>
    <a href="index.html" class="nav-link">Logout</a>
  </nav>

  <main class="content-wrap worker-layout">
    <section class="card">
      <div class="section-head">
        <h2>Ops Summary</h2>
        <div class="button-row">
          <button id="refresh-worker" class="mini-btn" type="button">Refresh</button>
          <label class="sound-toggle">
            <input id="critical-sound-toggle" type="checkbox" checked>
            <span>Critical Alert Sound</span>
          </label>
        </div>
      </div>
      <div id="worker-kpi-grid" class="kpi-grid"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Filters and Search</h2>
      </div>
      <div class="worker-filter-grid">
        <div>
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="ALL">All</option>
            <option value="OPEN">OPEN</option>
            <option value="ACCEPTED">ACCEPTED</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="RESOLVED">RESOLVED</option>
          </select>
        </div>
        <div>
          <label for="filter-priority">Priority</label>
          <select id="filter-priority">
            <option value="ALL">All</option>
            <option value="CRITICAL">CRITICAL</option>
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
          </select>
        </div>
        <div>
          <label for="filter-assigned">Assigned To</label>
          <select id="filter-assigned">
            <option value="ALL">All</option>
          </select>
        </div>
        <div>
          <label for="search-complaint">Search</label>
          <input id="search-complaint" type="text" placeholder="ID / Citizen ID / keyword">
        </div>
        <div>
          <label for="filter-sla">SLA Filter</label>
          <select id="filter-sla">
            <option value="ALL">All</option>
            <option value="ONLY_BREACHED">Only Breached</option>
            <option value="HIDE_BREACHED">Hide Breached</option>
          </select>
        </div>
      </div>
      <p class="hint">Queue is auto-sorted by priority and age. Critical + overdue items are pinned to top.</p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Worker Map View</h2>
      </div>
      <div class="map-legend">
        <span><i class="legend-dot critical"></i> Critical/Fault</span>
        <span><i class="legend-dot high"></i> High/In Progress</span>
        <span><i class="legend-dot medium"></i> Medium/Unknown</span>
        <span><i class="legend-dot normal"></i> Normal</span>
      </div>
      <div id="worker-map"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Priority Triage Queue</h2>
      </div>
      <div id="worker-complaints-list" class="grid-list"></div>
    </section>
  </main>

  <div id="worker-modal-overlay" class="modal-overlay hidden-card">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="worker-modal-title">
      <div class="section-head">
        <h2 id="worker-modal-title">Complaint Action Center</h2>
        <button id="close-worker-modal" class="mini-btn" type="button">Close</button>
      </div>
      <div id="worker-modal-content"></div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="worker.js"></script>
</body>
</html>
